name: Bug Report
description: 报告可复现的错误，帮助我们改进 KUI Vue Pro
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。提交前请先搜索已有 Issue，并确认问题可以稳定复现。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 使用的 KUI Vue Pro 版本或提交号
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、浏览器、Node.js 和包管理器版本
      placeholder: macOS 15 / Edge 140 / Node.js 22 / pnpm 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小复现仓库、在线示例或清晰的操作步骤
      placeholder: |
        1. 进入……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可附加截图、录屏、控制台错误或日志；请移除敏感信息
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索已有 Issue，未发现相同问题
          required: true
        - label: 我提供的信息不包含密码、Token 或其他敏感数据
          required: true
